<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Julia Starter</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #10131a;
      color: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #24344f, #10131a 52%);
    }

    main {
      width: min(92vw, 600px);
      padding: 2.5rem;
      border: 1px solid #334155;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); }
    p { color: #aab5c5; line-height: 1.6; }

    form {
      display: flex;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    input, button {
      min-height: 3rem;
      border: 1px solid #475569;
      border-radius: 10px;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 0.9rem;
      color: #f8fafc;
      background: #111827;
    }

    button {
      padding: 0 1.1rem;
      color: #111827;
      background: #fbbf24;
      border-color: #fbbf24;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    button:hover { background: #fcd34d; }

    #result {
      min-height: 4.5rem;
      margin: 1.5rem 0 0;
      padding: 1rem;
      border-radius: 10px;
      background: #0b1220;
      color: #cbd5e1;
    }

    .close {
      margin-top: 1.5rem;
      color: #94a3b8;
      background: transparent;
      border-color: #475569;
      font-size: 0.9rem;
    }

    .close:hover { color: #f8fafc; background: #1e293b; }

    @media (max-width: 480px) {
      main { padding: 1.5rem; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Julia + WebView</p>
    <h1>Fibonacci Lab</h1>
    <p>This HTML interface runs in a native desktop window. The calculation is handled by Julia through a WebView bridge.</p>

    <form id="calculator">
      <input id="number" type="number" min="0" max="50" step="1" value="10" aria-label="Fibonacci index">
      <button type="submit">Calculate</button>
    </form>

    <p id="result" role="status">Enter an index from 0 to 50.</p>
    <button class="close" id="close" type="button">Close window</button>
  </main>

  <script>
    const form = document.querySelector("#calculator");
    const input = document.querySelector("#number");
    const result = document.querySelector("#result");
    const close = document.querySelector("#close");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = Number(input.value);

      if (!Number.isInteger(value) || value < 0 || value > 50) {
        result.textContent = "Please enter a whole number from 0 to 50.";
        return;
      }

      result.textContent = "Calculating...";
      try {
        const response = await window.calculateFibonacci(value);
        result.textContent = `F(${response.input}) = ${response.result}`;
      } catch (error) {
        result.textContent = `Julia error: ${error}`;
      }
    });

    close.addEventListener("click", () => window.closeApp());
  </script>
</body>
</html>
